services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pocket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: pocket
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket"]
      interval: 5s
      retries: 5
  api:
    build: ../..
    command: ["go", "run", "./backend/cmd/server"]
    environment:
      DATABASE_URL: postgres://pocket:${POSTGRES_PASSWORD:-change-me}@db:5432/pocket?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
volumes:
  pgdata:
