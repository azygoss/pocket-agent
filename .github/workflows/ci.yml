name: ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: bufbuild/buf-setup-action@v1
      - name: P00+P01 gates
        run: |
          chmod +x scripts/*.sh tests/protocol/*.sh tests/security/*.sh
          ./scripts/secret-scan.sh
          ./scripts/license-check.sh
          ./scripts/check-packaging.sh
          buf lint
          ./tests/protocol/privacy-schema.sh
          ./tests/security/canary.sh
          go vet ./...
          go test ./... -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: lint + unit (emülatör yok; connectedTest atlanır)
        working-directory: apps/android
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest
