name: ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pocket, POSTGRES_PASSWORD: pocket, POSTGRES_DB: pocket_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pocket" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      PA_TEST_DATABASE_URL: postgres://pocket:pocket@127.0.0.1:5432/pocket_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: bufbuild/buf-setup-action@v1
      - name: P00+P01 gates
        run: |
          chmod +x scripts/*.sh tests/protocol/*.sh tests/security/*.sh
          ./scripts/secret-scan.sh
          ./scripts/license-check.sh
          ./scripts/check-packaging.sh
          buf lint
          ./tests/protocol/privacy-schema.sh
          ./tests/security/canary.sh
          go vet ./...
          go test ./... -v
          ./tests/e2e/keyless-pair.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: lint + unit (emülatör yok; connectedTest atlanır)
        working-directory: apps/android
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: build + unit tests (Simulator, unsigned)
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
          dest=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild test -project PocketAgent.xcodeproj -scheme PocketAgent -destination "id=$dest" \
            -only-testing:PocketAgentTests CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
